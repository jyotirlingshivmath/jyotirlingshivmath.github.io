body{
margin:0;
padding:0;
background:#f5f5f5;

}

.container{
width:92%;
max-width:1200px;
margin:auto;
padding:40px 0;
}

.page-title{
text-align:center;
margin-bottom:40px;
}

.page-title h1{

}

}

.blog-grid{

}

.blog-card{

.blog-card:hover{

}

.blog-card img{

height:220px;

.blog-content{
padding:20px;

.blog-date{

color:#222;
}

.blog-content p{
line-height:1.8;
font-size:16px;
color:#555;
}

.read-btn{
display:inline-block;
margin-top:18px;
padding:10px 22px;
background:#b22222;
color:#fff;
text-decoration:none;
border-radius:6px;
font-weight:bold;
}

.read-btn:hover{
background:#8b0000;
}

@media(max-width:768px){
