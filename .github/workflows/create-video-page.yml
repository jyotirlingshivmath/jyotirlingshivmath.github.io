name: Create Video Page

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube वीडियो ID (जैसे NF-hDuQ0uS8)"
        required: true
        type: string

      slug:
        description: "URL का नाम, छोटे अंग्रेजी अक्षरों में"
        required: true
        type: string

      title:
        description: "वीडियो का पूरा शीर्षक (हाथ से लिखें)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-page:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate HTML page
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          PAGE_SLUG: ${{ inputs.slug }}
          VIDEO_TITLE: ${{ inputs.title }}
        run: |
          python3 <<'PY'
          import os
          import re
          import html
          import urllib.request
          from pathlib import Path
          from datetime import datetime

          source_url = (
              "https://jyotirlingshivmath.in/shivpuran/2026/10/"
              "mata-parvati-ki-vidai-kailash-gaman-BQ5kT78Ajlc.html"
          )

          video_id = os.environ["VIDEO_ID"].strip()
          slug = os.environ["PAGE_SLUG"].strip().lower()
          title = os.environ["VIDEO_TITLE"].strip()

          if not re.fullmatch(r"[A-Za-z0-9_-]{11}", video_id):
              raise SystemExit(
                  "गलती: YouTube वीडियो ID ठीक 11 अक्षरों की होनी चाहिए।"
              )

          if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", slug):
              raise SystemExit(
                  "गलती: URL slug में छोटे अंग्रेजी अक्षर, अंक और hyphen ही रखें।"
              )

          # YouTube से पब्लिश होने का समय (uploadDate) केवल ऑटोमैटिक फेच करना
          yt_url = f"https://www.youtube.com/watch?v={video_id}"
          req = urllib.request.Request(yt_url, headers={"User-Agent": "Mozilla/5.0"})
          
          upload_datetime = ""
          description = "श्री ज्योतिर्लिंग शिवमठ, लखनऊ से प्रस्तुत पावन प्रसंग।"

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  yt_page = resp.read().decode("utf-8")
              
              # विवरण निकालना
              m_desc = re.search(r'<meta name="description" content="([^"]+)">', yt_page)
              if m_desc:
                  description = html.unescape(m_desc.group(1))

              # YouTube से पब्लिश होने का समय (uploadDate) निकालना
              m_date = re.search(r'"datePublished"\s*:\s*"([^"]+)"', yt_page)
              if m_date:
                  upload_datetime = m_date.group(1)
          except Exception as e:
              print(f"चेतावनी: YouTube से समय फेच करने में समस्या: {e}")

          # यदि समय न मिले तो वर्तमान समय सेट करें
          if not upload_datetime:
              upload_datetime = datetime.now().isoformat()

          # नमूना (Template) पेज डाउनलोड करना
          request = urllib.request.Request(
              source_url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  page = response.read().decode("utf-8")
          except Exception as e:
              raise SystemExit(f"नमूना पेज डाउनलोड नहीं हुआ: {e}")

          old_filename = (
              "mata-parvati-ki-vidai-kailash-gaman-BQ5kT78Ajlc.html"
          )
          old_title = (
              "माता पार्वती की विदाई और कैलाश गमन | शिवपुराण कथा | "
              "श्री ज्योतिर्लिंग शिवमठ"
          )
          old_description = (
              "श्री ज्योतिर्लिंग शिवमठ, लखनऊ से प्रस्तुत माता पार्वती की "
              "विदाई और कैलाश गमन का पावन प्रसंग। कथा व्यास महंत राजेश "
              "कुमार तिवारी 'रंजन'।"
          )

          if old_filename not in page or "BQ5kT78Ajlc" not in page:
              raise SystemExit(
                  "नमूना पेज का अपेक्षित HTML नहीं मिला। कोई पेज नहीं बनाया गया।"
              )

          new_filename = f"{slug}-{video_id}.html"

          # पेज में सभी जानकारियों को नए और सही डेटा से बदलना
          page = page.replace(old_filename, new_filename)
          page = page.replace("BQ5kT78Ajlc", video_id)
          page = page.replace(old_title, html.escape(title, quote=False))
          page = page.replace(old_description, html.escape(description, quote=False))
          page = page.replace("माता पार्वती की विदाई और कैलाश गमन", html.escape(title, quote=False))

          # VideoObject uploadDate को YouTube से मिले समय से बदलना
          page, count = re.subn(
              r'("uploadDate"\s*:\s*")[^"]+(")',
              lambda m: m.group(1) + upload_datetime + m.group(2),
              page,
              count=1
          )

          output = Path("shivpuran/2026/10") / new_filename
          output.parent.mkdir(parents=True, exist_ok=True)

          if output.exists():
              raise SystemExit(f"यह पेज पहले से मौजूद है: {output}")

          output.write_text(page, encoding="utf-8")
          print(f"नया HTML पेज तैयार: {output}")
          PY

      - name: Commit and push new page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- shivpuran/2026/10/
          
          if git diff --cached --quiet; then
            echo "कोई नई फाइल commit करने के लिए नहीं मिली।"
          else
            git commit -m "Create new video page with manual title and automatic YouTube time"
            git push
          fi
