name: Auto Update Sitemap Today

on:
  push:
    branches:
      - main
  
  # 1. इससे GitHub Actions टैब में "Run workflow" का बटन आ जाएगा (मैन्युअल चलाने के लिए)
  workflow_dispatch:

  # 2. इससे यह रोज़ाना भारतीय समयानुसार रात या सुबह तय समय पर अपने आप चल जाएगी (UTC समय के हिसाब से सेट करें)
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run sitemap generator script
        run: python generate_sitemap.py

      - name: Commit and push updated sitemap-today.xml
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add sitemap-today.xml
          git status
          if git diff --cached --quiet; then
            echo "No changes to sitemap-today.xml"
          else
            git commit -m "Auto-update sitemap-today.xml via GitHub Actions"
            git push
          fi
