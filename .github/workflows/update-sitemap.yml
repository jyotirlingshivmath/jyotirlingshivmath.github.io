name: Auto Update Sitemap Today

on:
  push:
    branches:
      - main # या आपकी जो भी मुख्य ब्रांच हो (जैसे master)

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run sitemap generator script
        run: python generate_sitemap.py

      - name: Commit and push updated sitemap-today.xml
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add sitemap-today.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update sitemap-today.xml via GitHub Actions" && git push)
