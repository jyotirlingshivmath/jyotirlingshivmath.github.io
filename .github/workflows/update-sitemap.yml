name: Auto Update Sitemap Today

on:
  push:
    branches:
      - main
  # अगर आप चाहें तो इसे रोज़ाना तय समय पर चलाने के लिए schedule भी जोड़ सकते हैं:
  # schedule:
  #   - cron: '0 0 * * *'

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run sitemap generator script
        run: python generate_sitemap.py

      - name: Commit and push updated sitemap-today.xml
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add sitemap-today.xml
          git status
          if git diff --cached --quiet; then
            echo "No changes to sitemap-today.xml"
          else
            git commit -m "Auto-update sitemap-today.xml via GitHub Actions"
            git push
          fi
